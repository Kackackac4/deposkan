name: Build

# PyInstaller nie potrafi budowac "w poprzek" systemow — .exe musi powstac na Windows,
# a .app na macOS. Dlatego jeden kod zrodlowy budujemy tutaj na dwoch maszynach naraz.
# Odpalasz to tagiem:  git tag v1.0.1 && git push --tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # mozna tez odpalic recznie z zakladki Actions

permissions:
  contents: write           # potrzebne, zeby workflow mogl utworzyc Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nazwa: macOS
          - os: windows-latest
            nazwa: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name DEPOSKAN --icon ikona.icns \
            --osx-bundle-identifier com.makroplast.deposkan \
            --collect-all webview \
            --hidden-import objc --hidden-import Foundation \
            --hidden-import AppKit --hidden-import WebKit \
            DEPOSKAN.py
          # Plik bundla zostaje DEPOSKAN.app (po tej nazwie aktualizuja sie zainstalowane
          # kopie), ale w pasku menu i Docku ma byc widac MakroSkan. Zmiana Info.plist
          # uniewaznia podpis ad-hoc, wiec podpisujemy bundle jeszcze raz.
          PL=dist/DEPOSKAN.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName MakroSkan" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MakroSkan" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MakroSkan" "$PL"
          codesign --force --deep --sign - dist/DEPOSKAN.app
          codesign --verify --deep --strict dist/DEPOSKAN.app
          # ditto zachowuje atrybuty i dowiazania w bundlu — zwykly zip potrafi
          # zepsuc podpis, a wtedy macOS mowi "plik uszkodzony" zamiast zwyklego
          # ostrzezenia o niezweryfikowanym tworcy
          cd dist && ditto -c -k --sequesterRsrc --keepParent DEPOSKAN.app DEPOSKAN-macOS.zip

      - name: Sprawdz skrypty PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Sprawdz($nazwa, $tresc) {
            $bledy = $null
            [System.Management.Automation.Language.Parser]::ParseInput(
              $tresc, [ref]$null, [ref]$bledy) | Out-Null
            if ($bledy.Count) {
              $bledy | ForEach-Object { Write-Error "$nazwa : $($_.Message)" }
              exit 1
            }
            Write-Host "$nazwa - skladnia poprawna"
          }

          Sprawdz "instaluj-win.ps1" (Get-Content instaluj-win.ps1 -Raw)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --windowed --onefile --name DEPOSKAN --icon ikona.ico `
            --collect-all webview DEPOSKAN.py

      # Prawdziwa podmiana na prawdziwym Windowsie, zanim wydanie trafi do ludzi:
      # "stara wersja" to kopia PING.EXE, ktora dziala 5 s i trzyma plik (jak otwarta
      # aplikacja). Nowy DEPOSKAN-nowy.exe --podmien musi poczekac, podmienic plik
      # i uruchomic go — a uruchomiona wersja zapisuje w logu "start testowy".
      - name: Test podmiany przy aktualizacji (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAKROSKAN_TEST: '1'
        run: |
          $d   = Join-Path $env:RUNNER_TEMP 'akt ząb'          # spacja i polski znak w sciezce
          New-Item -ItemType Directory -Force $d | Out-Null
          $cel = Join-Path $d 'DEPOSKAN.exe'
          $log = Join-Path $env:TEMP 'deposkan-aktualizacja.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          Copy-Item C:\Windows\System32\PING.EXE $cel
          $nowy = Join-Path $d 'DEPOSKAN-nowy.exe'
          Copy-Item dist\DEPOSKAN.exe $nowy
          $stary = Start-Process -FilePath $cel -ArgumentList '-n','6','127.0.0.1' -PassThru -WindowStyle Hidden
          # uruchamiamy tak jak aplikacja: bezposrednio (CreateProcess), nie przez powloke.
          # Nowa wersja sama jest procesem PyInstallera (ma zmienne _PYI_*) i uruchamia
          # wlasciwa aplikacje — dokladnie to psulo stary mechanizm; tu musi zadzialac
          $si = New-Object System.Diagnostics.ProcessStartInfo
          $si.FileName = $nowy
          $si.Arguments = "--podmien `"$cel`" $($stary.Id)"
          $si.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($si)
          Write-Host "uruchomiono nowa wersje, PID $($p.Id)"
          $wzor = (Get-FileHash dist\DEPOSKAN.exe).Hash
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 1
            $ok = (Test-Path $log) -and (Select-String -Path $log -Pattern 'start testowy' -Quiet)
            if ($ok) { break }
          }
          Write-Host "--- log aktualizacji:"; Get-Content $log -ErrorAction SilentlyContinue
          Write-Host "--- nowa wersja: zakonczona=$($p.HasExited) kod=$(if ($p.HasExited) { $p.ExitCode })"
          Write-Host "--- pliki:"; Get-ChildItem $d | Format-Table Name, Length -AutoSize | Out-String | Write-Host
          if ((Get-FileHash $cel).Hash -ne $wzor) { Write-Error 'plik NIE zostal podmieniony'; exit 1 }
          if (-not $ok) { Write-Error 'podmieniona wersja NIE wystartowala'; exit 1 }
          Write-Host 'podmiana i ponowne uruchomienie: OK'
          Get-Process DEPOSKAN -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Zapisz wynik
        uses: actions/upload-artifact@v4
        with:
          name: DEPOSKAN-${{ matrix.nazwa }}
          path: |
            dist/DEPOSKAN-macOS.zip
            dist/DEPOSKAN.exe
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: pliki }

      - name: Sumy kontrolne
        run: |
          cd pliki && find . -type f \( -name '*.zip' -o -name '*.exe' \) -exec sha256sum {} \; \
            | sed 's|\./[^/]*/||' > ../checksums.txt
          cat ../checksums.txt

      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pliki/**/DEPOSKAN-macOS.zip
            pliki/**/DEPOSKAN.exe
            checksums.txt
          generate_release_notes: true
          body: |
            ## Instalacja

            **Zalecane — bez ostrzezen systemu.**

            macOS (Terminal):

            ```
            curl -fsSL https://raw.githubusercontent.com/Kackackac4/deposkan/main/instaluj-mac.sh | bash
            ```

            Windows (PowerShell):

            ```
            irm https://raw.githubusercontent.com/Kackackac4/deposkan/main/instaluj-win.ps1 | iex
            ```

            Ta sama komenda sluzy rowniez do aktualizacji.

            **Recznie** — pliki ponizej dzialaja tak samo, ale przy pierwszym
            uruchomieniu system pokaze jednorazowe ostrzezenie do zatwierdzenia
            (aplikacja nie ma platnego certyfikatu). Instrukcja w
            [README](https://github.com/Kackackac4/deposkan#uruchomienie).

            ---

            Pliki zbudowal GitHub Actions z kodu w tym repozytorium; przebieg
            budowania jest jawny. Sumy kontrolne SHA-256 w `checksums.txt`.
